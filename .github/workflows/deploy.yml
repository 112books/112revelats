name: Deploy Hugo site

on:
  push:
    branches: [main]
  # Els commits del fetch els fa el GITHUB_TOKEN, que no encadena altres
  # workflows: el deploy no s'executaria i el web quedaria desfasat. Amb
  # workflow_run es reconstrueix el main al dia quan acaba el fetch.
  workflow_run:
    workflows: ["Fetch GoatCounter Analytics"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - run: hugo --minify
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
